<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Strata</title>
    <meta name="theme-color" content="#171717" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Strata: one picture of the installation, and the record behind it." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <body>
    <div id="root"></div>
    <!-- Night (red-light) display: maps imagery and canvases to luminance carried on the red channel only. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="night-red" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.30 0.59 0.11 0 0  0.04 0.08 0.02 0 0  0.02 0.04 0.01 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
